# Supabase project config (CLI + Edge Functions)
# https://docs.supabase.com/guides/functions/function-configuration

[auth]
site_url = "quillo://home"
additional_redirect_urls = [
  "quillo://home",
  "quillo://**",
  "https://quillo.app/auth/confirmed",
  "https://quillo.app/**",
  "https://quilloai.co.uk/**",
]

[functions.search-catalog]
verify_jwt = true

[functions.list-public-recipes]
verify_jwt = true

[functions.search-external-recipes]
verify_jwt = true

[functions.fetch-external-recipe]
verify_jwt = true

[functions.sync-bigoven-grocery]
verify_jwt = true

[functions.generate-recipes]
verify_jwt = true

[functions.generate-recipe-instructions]
verify_jwt = true

[functions.ocr-scan]
verify_jwt = true

[functions.upgrade-recipe-image]
verify_jwt = true
# wall_clock_timeout: set in Supabase Dashboard → Edge Functions → upgrade-recipe-image

[functions.send-welcome-email]
verify_jwt = false

[functions.process-scheduled-emails]
verify_jwt = false

[functions.process-scheduled-pushes]
verify_jwt = false
