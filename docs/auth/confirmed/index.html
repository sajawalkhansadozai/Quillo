<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email confirmed — Quillo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1b4332;
      --mint: #d8f3dc;
      --bg: #fafcfb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Nunito, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #e8eee9;
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(27, 67, 50, 0.06);
    }
    .badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--mint);
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 900;
      color: var(--ink);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      font-weight: 900;
      line-height: 1.2;
    }
    p {
      margin: 0 0 24px;
      color: #6b7280;
      font-size: 15px;
      line-height: 1.5;
      font-weight: 600;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
    }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: #9ca3af;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">✓</div>
    <h1>You're confirmed</h1>
    <p>Your Quillo email is verified. Open the app to start scanning receipts and cooking smarter.</p>
    <a class="btn" id="open-app" href="quillo://home">Open Quillo</a>
    <p class="hint">If the app doesn’t open, launch Quillo manually and sign in with the same email.</p>
  </main>
  <script>
    // Auto-attempt deep link once (mobile Safari / Chrome).
    setTimeout(function () {
      window.location.href = 'quillo://home';
    }, 600);
  </script>
</body>
</html>
